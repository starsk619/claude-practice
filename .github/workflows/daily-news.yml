name: Daily News Bot

# 노트북이 꺼져 있어도 매일 자동 실행되도록 GitHub Actions로 스케줄링.
# 매일 23:00 UTC = 08:00 KST (CRON_SCHEDULE 기본값과 동일한 시각).
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 같은 Pages 배포가 겹치지 않도록 직렬화 (진행 중인 배포는 취소하지 않고 대기)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # GitHub가 Node 20 러너를 곧 지원 종료할 예정이라(경고 발생), 러너 기본값과
          # 맞춰 24로 사용. 이 프로젝트 코드는 표준 fetch/FormData 등만 써서 호환 문제 없음.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run news bot pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          REPORT_PUBLIC_URL: https://starsk619.github.io/claude-practice/reports/daily-briefing.html
        run: node src/index.js --once

      - name: Prepare Pages artifact
        # 공개 URL 구조(.../reports/daily-briefing.html)를 그대로 맞추기 위해
        # _site/reports/ 아래에 최신 리포트 파일만 복사한다 (과거 이력은 배포하지 않음).
        run: |
          mkdir -p _site/reports
          cp reports/daily-briefing.html _site/reports/daily-briefing.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
